[project]
name = "qomm"
version = "0.1.0"
description = "Query-oblivious market making: quote without disclosing the request, the pricing rule, or the market."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "zkpi @ git+https://github.com/shukob/zkpi",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qomm_sim", "qomm_dsl", "qomm_audit", "qomm_transport", "mp_spdz", "scripts"]
